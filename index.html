"><button onclick="start('test')">Тест</button><button onclick="start('review')">Повторение</button><button onclick="start('hard')">Сложные</button></div><button onclick="edit(-1)">+ Добавить слово</button> <button onclick="bulk()">Импорт текста</button>`+s.words.map((w,j)=>`<section><b>${esc(w.en)}</b><p>${esc(w.ru)}</p><small>${esc(w.part)}</small><button onclick="edit(${j})">Изменить</button></section>`).join('')+'<button onclick="if(confirm(\'Удалить словарь?\')){db.sets.splice(sid,1);save();home()}">Удалить словарь</button>')}function oldEdit(j){let w=db.sets[sid].words[j]||{};render('<h2>Карточка</h2>'+[['en','Английский'],['ru','Перевод'],['part','Часть речи'],['meaning','Значение (необязательно)']].map(([k,l])=>`<label>${l}<input id="${k}" value="${esc(w[k])}"></label>`).join('')+`<div class="row"><button onclick="openSet(sid)">Отмена</button><button class="primary" onclick="store(${j})">Сохранить</button></div>`+(j>=0?`<button onclick="if(confirm('Удалить слово?')){db.sets[sid].words.splice(${j},1);save();openSet(sid)}">Удалить</button>`:''))}function oldStore(j){let w={...(db.sets[sid].words[j]||{})};for(let k of ['en','ru','part','meaning'])w[k]=$(k).value.trim();if(!w.en||!w.ru)return alert('Заполни слово и перевод');if(j<0)db.sets[sid].words.push(w);else db.sets[sid].words[j]=w;save();openSet(sid)}function bulk(){render('<h2>Импорт слов</h2><p>Одна строка: английское слово, затем табуляция или точка с запятой, затем перевод.</p><textarea id="bulk" rows="10"></textarea><button onclick="for(let l of $(\'bulk\').value.split(/\\n/)){let [en,ru]=l.split(/\\t|;/);if(en?.trim()&&ru?.trim())db.sets[sid].words.push({en:en.trim(),ru:ru.trim()})}save();openSet(sid)">Импортировать</button>')}function start(m){mode=m;queue=db.sets[sid].words.map((w,i)=>i).filter(i=>m==='hard'?db.sets[sid].words[i].hard:m!=='review'||!db.sets[sid].words[i].due||db.sets[sid].words[i].due<=Date.now());idx=0;study()}function study(){if(idx>=queue.length){render('<h1>Готово.</h1><p>На сегодня всё!</p><button onclick="openSet(sid)">К словарю</button>');return}let w=db.sets[sid].words[queue[idx]],head=`<button onclick="openSet(sid)">← Выйти</button><p class="muted">${idx+1} / ${queue.length}</p><div class="bar"><i style="width:${idx/queue.length*100}%"></i></div>`;if(mode==='cards'||mode==='review'||mode==='hard'){render(head+`<div class="flip" id="flip" role="button" tabindex="0" aria-label="Перевернуть карточку"><div class="inner"><div class="face"><div class="word">${esc(w.en)}</div><span class="muted">Нажми для перевода</span></div><div class="face back"><div class="word">${esc(w.ru)}</div><small>${esc(w.part)}</small><p>${esc(w.meaning)}</p></div></div></div>`);bindSwipe()}else{let opts=[...new Set([w.ru,...db.sets[sid].words.map(x=>x.ru).filter(x=>x!==w.ru).sort(()=>Math.random()-.5).slice(0,3)])].sort(()=>Math.random()-.5);render(head+`<section><div class="word">${esc(w.en)}</div></section>`+(mode==='write'?'<input id="answer" placeholder="Напиши перевод"><button onclick="check($(\'answer\').value)">Проверить</button>':opts.map((x,i)=>`<button style="display:block;width:100%;margin:8px 0" onclick="check(this.textContent)">${esc(x)}</button>`).join(''))+'<p id="feedback"></p>')}}let moving=false;function swipeGrade(dir){if(moving)return;let el=$('flip');if(!el){grade(dir==='right',dir==='hard');return}moving=true;el.style.transition='transform .23s ease, opacity .23s';el.style.transform=dir==='hard'?'translateY(-110vh)':`translateX(${dir==='right'?110:-110}vw) rotate(${dir==='right'?18:-18}deg)`;el.style.opacity='0';setTimeout(()=>{moving=false;if($('flip')===el)grade(dir==='right',dir==='hard')},240)}function bindSwipe(){let el=$('flip'),x=0,y=0,active=false;let hint=document.createElement('div');hint.className='gesture';el.append(hint);function flip(){el.classList.toggle('flipped');beep()}el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}else if(['ArrowLeft','ArrowRight','ArrowUp'].includes(e.key)){e.preventDefault();swipeGrade({ArrowLeft:'left',ArrowRight:'right',ArrowUp:'hard'}[e.key])}});el.addEventListener('pointerdown',e=>{if(moving||!e.isPrimary)return;active=true;x=e.clientX;y=e.clientY;el.style.transition='none';el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!active)return;let dx=e.clientX-x,dy=e.clientY-y;el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;hint.textContent=dy<-35&&-dy>Math.abs(dx)?'СЛОЖНОЕ':dx>35?'ЗАПОМНИЛА':dx<-35?'ЕЩЁ УЧУ':''});function reset(){el.style.transition='transform .2s';el.style.transform='';hint.textContent=''}el.addEventListener('pointercancel',()=>{active=false;reset()});el.addEventListener('pointerup',e=>{if(!active)return;active=false;let dx=e.clientX-x,dy=e.clientY-y;if(dy<-65&&-dy>Math.abs(dx))swipeGrade('hard');else if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy))swipeGrade(dx>0?'right':'left');else{reset();if(Math.hypot(dx,dy)<12)flip()}})}function check(a){let w=db.sets[sid].words[queue[idx]],ok=a.trim().toLowerCase()===w.ru.trim().toLowerCase();beep(ok);$('feedback').innerHTML=`<span class="${ok?'good':'bad'}">${ok?'Верно!':'Ответ: '+esc(w.ru)}</span> <button onclick="grade(${ok})">Далее →</button>`}function grade(ok,hard=false){let w=db.sets[sid].words[queue[idx]];w.known=ok;w.hard=hard||(!ok&&!!w.hard);w.level=ok?Math.min((w.level||0)+1,5):0;w.due=Date.now()+[0,1,3,7,14,30][w.level]*86400000;save();beep(ok);idx++;study()}function stats(){let a=db.sets.flatMap(s=>s.words);render(`<h1>Прогресс</h1><section><h2>${a.filter(w=>w.known).length} / ${a.length}</h2>Слов запомнила</section><section>${a.filter(w=>!w.due||w.due<=Date.now()).length} слов к повторению</section><section>${a.filter(w=>w.hard).length} сложных слов</section>`)}function settings(){render(`<h1>Настройки</h1><section><h2>Офлайн-словарь</h2><p id="offlineStatus">Проверка базы…</p><button id="downloadLex" onclick="installLex()">Загрузить словарь</button><p><label>Импорт базы (выбери index.json и ru.json)<in const families={back:{'back':['назад, обратно, спина, задняя часть, поддерживать','наречие, существительное, глагол, прилагательное'],'back up':['поддерживать, создавать резервную копию','фразовый глагол'],'backup':['резервная копия, запасной вариант','существительное'],'come back':['возвращаться','фразовый глагол'],'go back':['идти обратно','фразовый глагол'],'get back':['возвращаться, получать обратно','фразовый глагол'],'give back':['возвращать','фразовый глагол'],'look back':['оглядываться назад','фразовый глагол'],'back off':['отступать','фразовый глагол'],'backwards':['назад, задом наперёд','наречие'],'background':['фон, предыстория','существительное'],'backpack':['рюкзак','существительное']},look:{look:['смотреть, выглядеть, взгляд','глагол, существительное'],'look for':['искать','фразовый глагол'],'look after':['присматривать','фразовый глагол'],'look up':['искать информацию, смотреть вверх','фразовый глагол'],'look forward to':['с нетерпением ждать','выражение']},get:{get:['получать, становиться, добираться','глагол'],'get up':['вставать','фразовый глагол'],'get along':['ладить','фразовый глагол'],'get over':['преодолевать','фразовый глагол'],'get ready':['готовиться','выражение']},take:{take:['брать, принимать, занимать','глагол'],'take off':['снимать, взлетать','фразовый глагол'],'take care':['беречь себя, заботиться','выражение'],'take over':['перенимать управление','фразовый глагол']},light:{light:['свет, освещение, лёгкий, светлый, зажигать','существительное, прилагательное, глагол'],'light up':['освещать, загораться','фразовый глагол'],'lightweight':['лёгкий','прилагательное']}};

async function wikiWord(word){let url='https://en.wiktionary.org/w/api.php?'+new URLSearchParams({action:'parse',page:word,prop:'wikitext',format:'json',origin:'*'});let d=await jsonFetch(url),raw=d.parse?.wikitext?.['*']||'',en=raw.split(/^==English==\s*$/m)[1]?.split(/^==[^=].*==\s*$/m)[0]||'';let ru=[],parts=[],syn=[];let part='',inSyn=false;const names={Noun:'существительное',Verb:'глагол',Adjective:'прилагательное',Adverb:'наречие',Preposition:'предлог',Pronoun:'местоимение',Interjection:'междометие',Conjunction:'союз',Phrase:'выражение'};for(let line of en.split('\n')){let h=line.match(/^={3,}([^=]+)={3,}\s*$/);if(h){if(names[h[1]])part=names[h[1]];inSyn=h[1]==='Synonyms'}if(/^\*\s*Russian:/.test(line)){for(let m of line.matchAll(/\{\{t(?:\+|-)??\|ru\|([^|{}]+)(?:\||\}\})/g)){ru.push(m[1].replace(/\[\[|\]\]/g,''));if(part)parts.push(part)}}if(inSyn&&line.startsWith('*'))for(let m of line.matchAll(/\{\{(?:l|m)\|en\|([^|{}]+)/g))syn.push(m[1]);}return {ru:[...new Set(ru)].slice(0,14).join(', '),part:[...new Set(parts)].join(', '),syn:[...new Set(syn)].slice(0,8)};}

async function onlineLookupWord(){let word=norm($('en')?.value||'');if(!word)return;let seq=++lookupSeq,ru=$('ru'),part=$('part'),meaning=$('meaning'),initial=[ru.value,part.value,meaning.value],valid=()=>seq===lookupSeq&&$('ru')===ru&&norm($('en').value)===word;let family=Object.values(families).find(f=>f[word]),local=family?.[word];$('lookupStatus').textContent='Поиск…';if(local){ru.value=local[0];part.value=local[1];showRelated(Object.entries(family).filter(([k])=>k!==word).map(([en,v])=>({en,ru:v[0],part:v[1]})));$('lookupStatus').textContent='Встроенный словарь';return}try{let d=await wikiWord(word);if(!valid())return;if(d.ru&&ru.value===initial[0])ru.value=d.ru;if(d.part&&part.value===initial[1])part.value=d.part;if(d.syn.length&&meaning.value===initial[2])meaning.value='Синонимы: '+d.syn.join(', ');$('lookupStatus').textContent=d.ru?'Перевод: Wiktionary (CC BY-SA)':'Перевод не найден — можно ввести вручную';let q=await jsonFetch('https://api.datamuse.com/words?'+new URLSearchParams({sp:word+'*',md:'f',max:'35'}));if(!valid())return;let terms=q.filter(x=>x.word!==word&&x.word.length>word.length+1).sort((a,b)=>(parseFloat(b.tags?.find(t=>t.startsWith('f:'))?.slice(2))||0)-(parseFloat(a.tags?.find(t=>t.startsWith('f:'))?.slice(2))||0)).slice(0,6);let items=await Promise.all(terms.map(async x=>{try{let v=await wikiWord(x.word);return {en:x.word,...v}}catch{return {en:x.word}}}));if(valid())showRelated(items.filter(x=>x.ru));}catch{if(valid())$('lookupStatus').textContent='Онлайн-словарь недоступен. Введи перевод вручную или повтори поиск.'}}
function store(j){let w={...(db.sets[sid].words[j]||{})};for(let k of ['en','ru','part','meaning'])w[k]=$(k).value.trim();if(!w.en||!w.ru)return alert('Заполни слово и перевод');let words=db.sets[sid].words;if(j<0)words.push(w);else words[j]=w;document.querySelectorAll('[data-related]:checked').forEach(el=>{let a=suggestions[Number(el.dataset.related)];if(a?.ru&&!words.some(x=>norm(x.en)===norm(a.en)))words.push({en:a.en,ru:a.ru,part:a.part||''})});lookupSeq++;save();openSet(sid)}

const posNames={noun:'существительное',verb:'глагол',adjective:'прилагательное',adj:'прилагательное',adverb:'наречие',adv:'наречие',pronoun:'местоимение',preposition:'предлог',conjunction:'союз',phrase:'выражение',interjection:'междометие',determiner:'определитель',num:'числительное',pron:'местоимение',prep:'предлог',conj:'союз',intj:'междометие',det:'определитель',particle:'частица',article:'артикль',name:'имя собственное',prep_phrase:'предложное выражение',postp:'послелог',proverb:'пословица'};
function translationText(v){if(typeof v==='string')return v;if(Array.isArray(v))return v.map(translationText).filter(Boolean).join(', ');if(v&&typeof v.w==='string')return v.w;return ''}
function tableRows(data,required){if(Array.isArray(data))return data;if(!Array.isArray(data?.columns)||!Array.isArray(data?.rows))throw Error("Неверный формат JSON");let ids=required.map(k=>data.columns.indexOf(k));if(ids.some(i=>i<0))throw Error("Отсутствуют столбцы словаря");return data.rows.filter(Array.isArray).map(row=>ids.map(i=>row[i]));}
async function saveLex(index,ru){index=tableRows(index,["slug","word","pos"]);ru=tableRows(ru,["slug","translation","romanization","machine"]);if(!Array.isArray(index)||!Array.isArray(ru))throw Error('Неверный формат JSON');let translations=new Map(ru.filter(Array.isArray).map(x=>[x[0],x]));let map=new Map();for(let a of index){if(!Array.isArray(a)||typeof a[1]!=='string')continue;let r=translations.get(a[0]),text=translationText(r?.[1]);if(!text)continue;let key=norm(a[1]),old=map.get(key),part=posNames[a[2]]||a[2]||'';map.set(key,{en:a[1],ru:old?[...new Set([old.ru,text])].join('; '):text,part:old?[...new Set([old.part,part])].filter(Boolean).join(', '):part,machine:!!r[3],slug:a[0]})}if(map.size<1000)throw Error('Найдено только '+map.size+' записей: проверь файлы базы');await lexWrite([...map]);lex=map;lexStatus('Словарь сохранён: '+lex.size+' слов и выражений.');}
async function installLex(){if(lexLoading)return;lexLoading=true;lexStatus('Загрузка словарной базы…');let errors=[];try{for(let urls of [['./dictionary-index.json','./dictionary-ru.json'],[lexURL+'index.json',lexURL+'langs/ru.json'],['https://raw.githubusercontent.com/MethodoxTech/Multilingualism/HEAD/data/index.json','https://raw.githubusercontent.com/MethodoxTech/Multilingualism/HEAD/data/langs/ru.json']]){try{let [i,r]=await Promise.all(urls.map(jsonFetch));await saveLex(i,r);return}catch(e){errors.push(e.message)}}lexStatus('Не удалось загрузить: '+errors.join(' / ')+'. Используй импорт файлов.')}finally{lexLoading=false;if($('downloadLex'))$('downloadLex').disabled=false}}
async function importLex(files){if(lexLoading)return;let f=[...files],i=f.find(x=>/index/i.test(x.name)),r=f.find(x=>/ru\.json/i.test(x.name));if(!i||!r){lexStatus('Выбери одновременно index.json и ru.json');return}lexLoading=true;try{lexStatus('Импорт базы…');await saveLex(JSON.parse(await i.text()),JSON.parse(await r.text()))}catch(e){lexStatus('Ошибка импорта: '+e.message)}finally{lexLoading=false;if($('downloadLex'))$('downloadLex').disabled=false}}
function relatedOffline(word){let result=[],seen=new Set([word]);let family=Object.values(families).find(f=>f[word]);for(let [en,v] of Object.entries(family||{})){if(!seen.has(en)){seen.add(en);result.push({en,ru:v[0],part:v[1]})}}for(let [key,v] of lex){if(seen.has(key))continue;let tokens=key.split(/[ -]+/);if(tokens.includes(word)||(word.length>=4&&key.startsWith(word)&&key.length>word.length&&key.length<=word.length+8)){seen.add(key);result.push(v)}if(result.length>=12)break}return result}
async function lookupWord(){let word=norm($('en')?.value||'');if(!word)return;let seq=++lookupSeq,ru=$('ru'),part=$('part'),meaning=$('meaning'),before=[ru.value,part.value,meaning.value];let valid=()=>seq===lookupSeq&&$('ru')===ru&&norm($('en').value)===word;await lexReady;if(!valid())return;let family=Object.values(families).find(f=>f[word]),local=family?.[word],v=lex.get(word);if(!v&&!local){return onlineLookupWord()}if(ru.value===before[0])ru.value=local?.[0]||v.ru;if(part.value===before[1])part.value=local?.[1]||v.part;showRelated(relatedOffline(word));$('lookupStatus').textContent='Офлайн-словарь'+(!local&&v.machine?' · машинный перевод':'');if(!navigator.onLine)return;try{let d=await wikiWord(word);if(!valid())return;if(d.ru&&!local&&ru.value===v.ru)ru.value=[...new Set((v.ru+', '+d.ru).split(', ').filter(Boolean))].join(', ');if(d.part&&!local&&part.value===v.part)part.value=d.part;if(d.syn.length&&meaning.value===before[2])meaning.value='Синонимы: '+d.syn.join(', ');$('lookupStatus').textContent='Офлайн-словарь · дополнено Wiktionary'}catch{}}

home();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
