<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>LogEngli</title><style>*{box-sizing:border-box}body{margin:0;background:#ffffff;color:#111111;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:540px;margin:auto;padding:24px 20px 100px}h1,h2{font-family:Georgia,serif;font-weight:400}h1{font-size:42px;margin:10px 0}button,input,textarea,select{font:inherit;border:1px solid #dedede;border-radius:14px;padding:12px;background:#fff;color:inherit}button{cursor:pointer}button.primary{background:#111111;color:white;border:0}button:active{transform:scale(.97)}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.row>*{flex:1}section,.tile{background:#fff;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 5px 24px #253c2510}.muted{color:#777777;font-size:13px}input,textarea{width:100%;margin:5px 0}nav{position:fixed;bottom:0;left:0;right:0;background:#ffffff;display:flex;justify-content:center;gap:8px;padding:12px 10px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #ddd}nav button{border:0;background:none}.flip{perspective:1000px;height:250px;margin:20px 0}.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;background:white;border-radius:25px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;box-shadow:0 8px 30px #283d2515}.back{transform:rotateY(180deg);background:#f3f3f3}.word{font:500 32px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:-.035em;overflow-wrap:anywhere}.back .word{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;letter-spacing:-.015em}.bar{height:6px;background:#eeeeee;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#111111}small{display:block;margin:8px 0}.good{color:#111111}.bad{color:#555555}@media(prefers-reduced-motion:reduce){.inner{transition:none}}body{overflow-x:hidden}main{padding-top:calc(24px + env(safe-area-inset-top))}h1{letter-spacing:-2px}.flip{height:clamp(260px,43vh,420px);touch-action:none;user-select:none;position:relative;will-change:transform}.face{border:1px solid #ddd;box-shadow:0 8px 24px #0000000d;-webkit-backface-visibility:hidden}.inner{-webkit-transform-style:preserve-3d}.word{font-size:clamp(28px,8vw,44px)}.face p{max-height:35%;overflow:auto}.gesture{position:absolute;top:16px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:1px;pointer-events:none;z-index:2}.row button{min-height:48px}section{border:1px solid #eee;box-shadow:none}button:focus-visible{outline:2px solid #111;outline-offset:2px}</style><main id="app"></main><nav><button onclick="home()">Словари</button><button onclick="stats()">Прогресс</button><button onclick="settings()">Настройки</button></nav><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db;try{db=JSON.parse(localStorage.logengli||localStorage.memora||'null')}catch{};db=db||{sets:[{name:'Мой английский',words:[{en:'Every day',ru:'Каждый день',part:'Обстоятельство частотности',ex:'I drink coffee every day.'},{en:'Do',ru:'Делать',part:'Глагол',ex:'I do my homework.'},{en:'Back',ru:'Назад, обратно',part:'Наречие',ex:'Come back home.'}]}],sound:true};let sid=0,idx=0,queue=[],mode='cards',ctx;function save(){try{localStorage.logengli=JSON.stringify(db)}catch{alert('Не удалось сохранить данные. Сделай резервную копию.')}}function beep(ok=true){if(!db.sound)return;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=ok?660:220;g.gain.setValueAtTime(.045,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.16);o.start();o.stop(ctx.currentTime+.17)}catch{}}function say(t){if(window.speechSynthesis){let u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.speak(u)}}function render(s){$('app').innerHTML=s;window.scrollTo(0,0)}function home(){render('<div class="muted">PERSONAL ENGLISH JOURNAL</div><h1>LogEngli</h1><p>Маленькие шаги каждый день.</p>'+db.sets.map((s,i)=>`<section onclick="openSet(${i})"><h2>${esc(s.name)}</h2><span class="muted">${s.words.length} слов · ${s.words.filter(w=>w.known).length} изучено</span></section>`).join('')+'<button class="primary" onclick="newSet()">+ Новый словарь</button>')}function newSet(){let n=prompt('Название словаря');if(n?.trim()){db.sets.push({name:n.trim(),words:[]});save();openSet(db.sets.length-1)}}function openSet(i){sid=i;let s=db.sets[i];render(`<button onclick="home()">← Назад</button><h1>${esc(s.name)}</h1><div class="row"><button class="primary" onclick="start('cards')">Карточки</button><button onclick="start('write')">Письмо</button></div><div class="row"><button onclick="start('test')">Тест</button><button onclick="start('review')">Повторение</button><button onclick="start('hard')">Сложные</button></div><button onclick="edit(-1)">+ Добавить слово</button> <button onclick="bulk()">Импорт текста</button>`+s.words.map((w,j)=>`<section><b>${esc(w.en)}</b><p>${esc(w.ru)}</p><small>${esc(w.part)}</small><button onclick="edit(${j})">Изменить</button> <button onclick="say(db.sets[sid].words[${j}].en)">🔊</button></section>`).join('')+'<button onclick="if(confirm(\'Удалить словарь?\')){db.sets.splice(sid,1);save();home()}">Удалить словарь</button>')}function edit(j){let w=db.sets[sid].words[j]||{};render('<h2>Карточка</h2>'+[['en','Английский'],['ru','Перевод'],['part','Часть речи'],['meaning','Значение (необязательно)']].map(([k,l])=>`<label>${l}<input id="${k}" value="${esc(w[k])}"></label>`).join('')+`<div class="row"><button onclick="openSet(sid)">Отмена</button><button class="primary" onclick="store(${j})">Сохранить</button></div>`+(j>=0?`<button onclick="if(confirm('Удалить слово?')){db.sets[sid].words.splice(${j},1);save();openSet(sid)}">Удалить</button>`:''))}function store(j){let w={...(db.sets[sid].words[j]||{})};for(let k of ['en','ru','part','meaning'])w[k]=$(k).value.trim();if(!w.en||!w.ru)return alert('Заполни слово и перевод');if(j<0)db.sets[sid].words.push(w);else db.sets[sid].words[j]=w;save();openSet(sid)}function bulk(){render('<h2>Импорт слов</h2><p>Одна строка: английское слово, затем табуляция или точка с запятой, затем перевод.</p><textarea id="bulk" rows="10"></textarea><button onclick="for(let l of $(\'bulk\').value.split(/\\n/)){let [en,ru]=l.split(/\\t|;/);if(en?.trim()&&ru?.trim())db.sets[sid].words.push({en:en.trim(),ru:ru.trim()})}save();openSet(sid)">Импортировать</button>')}function start(m){mode=m;queue=db.sets[sid].words.map((w,i)=>i).filter(i=>m==='hard'?db.sets[sid].words[i].hard:m!=='review'||!db.sets[sid].words[i].due||db.sets[sid].words[i].due<=Date.now());idx=0;study()}function study(){if(idx>=queue.length){render('<h1>Готово.</h1><p>На сегодня всё!</p><button onclick="openSet(sid)">К словарю</button>');return}let w=db.sets[sid].words[queue[idx]],head=`<button onclick="openSet(sid)">← Выйти</button><p class="muted">${idx+1} / ${queue.length}</p><div class="bar"><i style="width:${idx/queue.length*100}%"></i></div>`;if(mode==='cards'||mode==='review'||mode==='hard'){render(head+`<div class="flip" id="flip" role="button" tabindex="0" aria-label="Перевернуть карточку"><div class="inner"><div class="face"><div class="word">${esc(w.en)}</div><span class="muted">Нажми для перевода</span></div><div class="face back"><div class="word">${esc(w.ru)}</div><small>${esc(w.part)}</small><p>${esc(w.meaning)}</p></div></div></div><button onclick="say(db.sets[sid].words[queue[idx]].en)">🔊 Произношение</button><div class="row"><button onclick="swipeGrade('left')">Ещё учу</button><button class="primary" onclick="swipeGrade('right')">Запомнила</button></div><button onclick="swipeGrade('hard')">↑ Сложное слово</button> <button onclick="queue=queue.slice(idx).sort(()=>Math.random()-.5);idx=0;study()">Перемешать</button>`);bindSwipe()}else{let opts=[...new Set([w.ru,...db.sets[sid].words.map(x=>x.ru).filter(x=>x!==w.ru).sort(()=>Math.random()-.5).slice(0,3)])].sort(()=>Math.random()-.5);render(head+`<section><div class="word">${esc(w.en)}</div></section>`+(mode==='write'?'<input id="answer" placeholder="Напиши перевод"><button onclick="check($(\'answer\').value)">Проверить</button>':opts.map((x,i)=>`<button style="display:block;width:100%;margin:8px 0" onclick="check(this.textContent)">${esc(x)}</button>`).join(''))+'<p id="feedback"></p>')}}let moving=false;function swipeGrade(dir){if(moving)return;let el=$('flip');if(!el){grade(dir==='right',dir==='hard');return}moving=true;el.style.transition='transform .23s ease, opacity .23s';el.style.transform=dir==='hard'?'translateY(-110vh)':`translateX(${dir==='right'?110:-110}vw) rotate(${dir==='right'?18:-18}deg)`;el.style.opacity='0';setTimeout(()=>{moving=false;if($('flip')===el)grade(dir==='right',dir==='hard')},240)}function bindSwipe(){let el=$('flip'),x=0,y=0,active=false;let hint=document.createElement('div');hint.className='gesture';el.append(hint);function flip(){el.classList.toggle('flipped');beep()}el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}else if(['ArrowLeft','ArrowRight','ArrowUp'].includes(e.key)){e.preventDefault();swipeGrade({ArrowLeft:'left',ArrowRight:'right',ArrowUp:'hard'}[e.key])}});el.addEventListener('pointerdown',e=>{if(moving||!e.isPrimary)return;active=true;x=e.clientX;y=e.clientY;el.style.transition='none';el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!active)return;let dx=e.clientX-x,dy=e.clientY-y;el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;hint.textContent=dy<-35&&-dy>Math.abs(dx)?'СЛОЖНОЕ':dx>35?'ЗАПОМНИЛА':dx<-35?'ЕЩЁ УЧУ':''});function reset(){el.style.transition='transform .2s';el.style.transform='';hint.textContent=''}el.addEventListener('pointercancel',()=>{active=false;reset()});el.addEventListener('pointerup',e=>{if(!active)return;active=false;let dx=e.clientX-x,dy=e.clientY-y;if(dy<-65&&-dy>Math.abs(dx))swipeGrade('hard');else if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy))swipeGrade(dx>0?'right':'left');else{reset();if(Math.hypot(dx,dy)<12)flip()}})}function check(a){let w=db.sets[sid].words[queue[idx]],ok=a.trim().toLowerCase()===w.ru.trim().toLowerCase();beep(ok);$('feedback').innerHTML=`<span class="${ok?'good':'bad'}">${ok?'Верно!':'Ответ: '+esc(w.ru)}</span> <button onclick="grade(${ok})">Далее →</button>`}function grade(ok,hard=false){let w=db.sets[sid].words[queue[idx]];w.known=ok;w.hard=hard||(!ok&&!!w.hard);w.level=ok?Math.min((w.level||0)+1,5):0;w.due=Date.now()+[0,1,3,7,14,30][w.level]*86400000;save();beep(ok);idx++;study()}function stats(){let a=db.sets.flatMap(s=>s.words);render(`<h1>Прогресс</h1><section><h2>${a.filter(w=>w.known).length} / ${a.length}</h2>Слов запомнила</section><section>${a.filter(w=>!w.due||w.due<=Date.now()).length} слов к повторению</section><section>${a.filter(w=>w.hard).length} сложных слов</section>`)}function settings(){render(`<h1>Настройки</h1><section><label><input style="width:auto" type="checkbox" ${db.sound?'checked':''} onchange="db.sound=this.checked;save()"> Звуки</label></section><button onclick="exportDB()">Экспорт словарей</button><p>Восстановить резервную копию:</p><input type="file" accept=".json" onchange="restore(this.files[0])">`)}function exportDB(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='logengli-backup.json';a.click()}async function restore(f){try{let d=JSON.parse(await f.text());if(!Array.isArray(d.sets)||!d.sets.every(s=>typeof s.name==='string'&&Array.isArray(s.words)&&s.words.every(w=>typeof w.en==='string'&&typeof w.ru==='string')))throw 0;if(confirm('Заменить текущие словари?')){db=d;save();home()}}catch{alert('Некорректный файл')}}home();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
